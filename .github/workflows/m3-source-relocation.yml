# SPDX-License-Identifier: Apache-2.0
name: M3 Guava recipe-generated staged source relocation
on:
  pull_request:
    paths:
      - '.m3-relocation/**'
      - '.github/workflows/m3-source-relocation.yml'
  push:
    branches:
      - 'm3/package-relocation-20261018'
    paths:
      - '.m3-relocation/**'
      - '.github/workflows/m3-source-relocation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  openrewrite-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dry run source-first OpenRewrite ChangePackage without changing fork source
        run: |
          set -eu
          mvn -B -ntp org.openrewrite.maven:rewrite-maven-plugin:5.23.1:dryRun \
            -Drewrite.configLocation=.m3-relocation/rewrite.yml \
            -Drewrite.activeRecipes=com.synexia.m3.RelocateGuavaFork20261018
      - name: Upload generated Java LST source diff and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-guava-source-first-diff
          if-no-files-found: warn
          path: |
            **/target/rewrite/*.patch
            **/target/rewrite/rewrite.patch
  materialize-only-on-pinned-fork-branch:
    needs: openrewrite-dryrun
    if: >-
      github.event_name == 'push' &&
      github.repository == 'hsoliwal/guava' &&
      github.ref == 'refs/heads/m3/package-relocation-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3/package-relocation-20261018
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply the exact reviewed OpenRewrite recipe to fork branch only
        run: |
          set -eu
          git diff --exit-code
          mvn -B -ntp org.openrewrite.maven:rewrite-maven-plugin:5.23.1:run \
            -Drewrite.configLocation=.m3-relocation/rewrite.yml \
            -Drewrite.activeRecipes=com.synexia.m3.RelocateGuavaFork20261018
          git diff --check
      - name: Refuse non-materialized or partial package move
        run: |
          set -eu
          before_count="$(git ls-files 'guava/src/com/google/common/*' | grep -c '\.java$' || true)"
          after_count="$(find 'guava/src/com/m3/sdk/guava' -type f -name '*.java' | wc -l)"
          old_remaining="$(find 'guava/src/com/google/common' -type f -name '*.java' 2>/dev/null | wc -l)"
          echo "source_count=$before_count transformed_count=$after_count old_remaining=$old_remaining"
          test "$before_count" -gt 0
          test "$after_count" -ge "$before_count"
          test "$old_remaining" -eq 0
          git diff --check
      - name: Build actual relocated source before admission
        run: mvn -B -ntp -pl guava -am -DskipTests package
      - name: Commit *recipe-generated* source only on the isolated fork branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(m3 SDK): materialize pinned Guava package relocation by OpenRewrite'
          git push origin HEAD:refs/heads/m3/package-relocation-20261018
