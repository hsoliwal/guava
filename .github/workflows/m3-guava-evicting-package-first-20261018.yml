# SPDX-License-Identifier: Apache-2.0
name: M3 Guava full namespace and independent original differential
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'guava/**'
      - 'guava-testlib/**'
      - 'guava-tests/**'
      - 'android/**'
      - 'futures/**'
      - 'proguard/**'
      - 'm3/**'
      - 'pom.xml'
      - '.github/workflows/m3-guava-evicting-package-first-20261018.yml'
permissions:
  contents: read
jobs:
  native-source-and-original-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: jre
            source: '.'
          - variant: android
            source: 'android'
    env:
      M3_DONOR_PIN: dfd9dca629d44faf71846b1f85acd38556f4854d
      M3_ARRAY_ORIGINAL_PIN: 120424a121f1cbda05d2fe0f041779b2344d8ccb
      MAVEN_OPTS: '-Xmx2560m'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recover immutable original source and full independent evaluation
        run: |
          set -eu
          ORIGINAL="$RUNNER_TEMP/m3-guava-original"
          git cat-file -e "$M3_DONOR_PIN^{commit}"
          git worktree add --detach "$ORIGINAL" "$M3_DONOR_PIN"
          python3 - <<'PYCODE'
          import csv, hashlib, os, subprocess
          from pathlib import Path
          pin=os.environ['M3_DONOR_PIN']
          q=Path('m3/guava-package-first/recipe')
          for row in csv.reader((q/'manifest.tsv').read_text().splitlines(), delimiter='\t'):
              path, before, expected, template=row
              original=subprocess.check_output(['git','show',pin+':'+path])
              assert hashlib.sha256(original).hexdigest()==expected, path
              assert hashlib.sha256((q/template).read_bytes()).hexdigest()==expected, template
          ledger={row['source_path']:row for row in csv.DictReader(
              Path('m3/package-import-rename-20261018/NAMESPACE_CHANGES.tsv').open(), delimiter='\t')}
          for relative in ('guava/src/com/google/common/collect/EvictingQueue.java',
                           'android/guava/src/com/google/common/collect/EvictingQueue.java',
                           'm3/guava-package-first/src/main/java/com/m3/collections/guava/collect/EvictingQueue.java'):
              row=ledger[relative]
              original=subprocess.check_output(['git','show',pin+':'+relative])
              current=Path(row['destination_path']).read_bytes()
              assert hashlib.sha256(original).hexdigest()==row['preimage_sha256'], relative
              assert hashlib.sha256(current).hexdigest()==row['postimage_sha256'], relative
              marker=b'public final class EvictingQueue'
              assert original[original.index(marker):]==current[current.index(marker):], relative
          print('PASS immutable source/evaluation seals and unchanged queue algorithm bodies')
          PYCODE
      - name: Compile authoritative original owner classes with the declared compiler
        run: |
          set -eu
          mvn -version
          mvn -B -ntp -f "$RUNNER_TEMP/m3-guava-original/${{ matrix.source }}/pom.xml" \
            -pl guava,guava-testlib -am -Dsurefire.toolchain.version=21 \
            -Dmaven.compiler.meminitial=128m -Dmaven.compiler.maxmem=768m compile
      - name: Reconstruct the exact qualified native checker receiver
        run: |
          set -eu
          OWNER=m3/package-import-rename-20261018/verification-dependencies/error-prone-overlay
          OUT="$RUNNER_TEMP/m3-error-prone-owner"
          CACHE="$HOME/.m2/repository"
          mkdir -p "$OUT"
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=com.google.errorprone:error_prone_core:2.50.0
          python3 "$OWNER/reconstruct.py" \
            --original-jar "$CACHE/com/google/errorprone/error_prone_core/2.50.0/error_prone_core-2.50.0.jar" \
            --original-pom "$CACHE/com/google/errorprone/error_prone_core/2.50.0/error_prone_core-2.50.0.pom" \
            --overlay "$OWNER" --output "$OUT/receiver"
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$OUT/receiver/error_prone_core-2.50.0-m3-guava-namespace-20261018.jar" \
            -DpomFile="$OUT/receiver/error_prone_core-2.50.0-m3-guava-namespace-20261018.pom"
      - name: Build isolated relocated external signature receivers
        run: |
          mvn -B -ntp -f m3/package-import-rename-20261018/verification-dependencies/pom.xml install
      - name: Compile pinned original JRE storage oracle for array contracts
        if: matrix.variant == 'jre'
        run: |
          set -eu
          ORIGINAL="$RUNNER_TEMP/m3-guava-array-original"
          git cat-file -e "$M3_ARRAY_ORIGINAL_PIN^{commit}"
          git worktree add --detach "$ORIGINAL" "$M3_ARRAY_ORIGINAL_PIN"
          mvn -B -ntp -f "$ORIGINAL/pom.xml" -Pm3-relocated-verification \
            -pl guava,guava-testlib -am -Dsurefire.toolchain.version=21 \
            -Dmaven.compiler.meminitial=128m -Dmaven.compiler.maxmem=768m compile
      - name: Compile and run the complete native evaluation without disabling tests
        run: |
          mvn -B -ntp -f '${{ matrix.source }}/pom.xml' -Pm3-relocated-verification -Dm3.verification.test.heap=1536m \
            -Dm3.baseline.classes="$RUNNER_TEMP/m3-guava-array-original/guava/target/classes" \
            -pl guava,guava-testlib,guava-tests -am -Dsurefire.toolchain.version=21 \
            -Dmaven.compiler.meminitial=128m -Dmaven.compiler.maxmem=768m test
      - name: Prove independent original versus native and existing working queue receivers
        run: |
          set -eu
          TASK=m3/package-import-rename-20261018
          ORIGINAL="$RUNNER_TEMP/m3-guava-original"
          OUT="$RUNNER_TEMP/m3-guava-${{ matrix.variant }}-differential"
          mkdir -p "$OUT/native" "$OUT/working" "$OUT/refusal"
          mvn -B -ntp -f "$TASK/parser-dependencies/pom.xml" \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath \
            -Dmdep.outputFile="$OUT/external-classpath.txt"
          ORIGINAL_CLASSES="$ORIGINAL/${{ matrix.source }}/guava/target/classes"
          CURRENT_CLASSES="${{ matrix.source }}/guava/target/classes"
          PROOF="$ORIGINAL/m3/guava-package-first/src/test/java/com/m3/collections/guava/collect/M3GuavaEvictingRelocationProof.java"
          CURRENT_PROOF=m3/guava-package-first/src/test/java/com/m3/collections/guava/collect/M3GuavaEvictingRelocationProof.java
          QUEUE=m3/guava-package-first/src/main/java/com/m3/collections/guava/collect/EvictingQueue.java
          CP="$CURRENT_CLASSES:$ORIGINAL_CLASSES:$(cat "$OUT/external-classpath.txt")"
          javac -J-Xmx256m --release 21 -proc:none -Xlint:all -Werror -cp "$CP" -d "$OUT/native" "$PROOF"
          java -Xmx256m -ea -cp "$OUT/native:$CP" com.m3.collections.guava.collect.M3GuavaEvictingRelocationProof
          javac -J-Xmx256m --release 21 -proc:none -Xlint:all -cp "$CP" -d "$OUT/working" "$QUEUE"
          javac -J-Xmx256m --release 21 -proc:none -Xlint:all -Werror -cp "$OUT/working:$CP" -d "$OUT/working" "$PROOF"
          java -Xmx256m -ea -cp "$OUT/working:$CP" com.m3.collections.guava.collect.M3GuavaEvictingRelocationProof
          javac -J-Xmx256m --release 21 -proc:none -Xlint:all -Werror -cp "$CP" -d "$OUT/refusal" "$CURRENT_PROOF"
          if java -Xmx256m -ea -cp "$OUT/refusal:$CP" com.m3.collections.guava.collect.M3GuavaEvictingRelocationProof > "$OUT/refusal.log" 2>&1; then
            echo 'same-class differential was incorrectly accepted'
            exit 1
          fi
          grep -F 'Independent oracle required; use the pinned original-source workflow' "$OUT/refusal.log"
      - name: Retain actual native evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-guava-${{ matrix.variant }}-namespace-evidence
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/*.xml
