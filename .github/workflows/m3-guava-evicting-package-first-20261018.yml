# SPDX-License-Identifier: Apache-2.0
name: M3 fork package-only Guava EvictingQueue
on:
  pull_request:
    paths:
      - 'm3/guava-package-first/**'
      - '.github/workflows/m3-guava-evicting-package-first-20261018.yml'
  workflow_dispatch:
jobs:
  java21-exact-relocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify original full source, pure package/import changes and canonical seals
        run: |
          set -eu
          Q=m3/guava-package-first/recipe
          awk -F '\t' '{print $3 "  " $1}' "$Q/manifest.tsv" | sha256sum -c -
          awk -F '\t' -v q="$Q" '{print $3 "  " q "/" $4}' "$Q/manifest.tsv" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          original=Path('guava/src/com/google/common/collect/EvictingQueue.java').read_text()
          relocated=Path('m3/guava-package-first/src/main/java/com/m3/collections/guava/collect/EvictingQueue.java').read_text()
          expected=original.replace('package com.google.common.collect;',
                                    'package com.m3.collections.guava.collect;')
          expected=expected.replace('import com.google.common.annotations.GwtCompatible;',
              'import com.google.common.collect.ForwardingQueue;\n'
              'import com.google.common.collect.Iterables;\n'
              'import com.google.common.annotations.GwtCompatible;')
          assert relocated == expected, 'unexpected change outside package/import'
          print('PASS complete original Guava class algorithm unchanged')
          PY
      - name: Compile unmodified original Guava core from fork sources
        run: mvn -B -ntp -pl guava -am -DskipTests install
      - name: Compile relocated class and execute full Guava differential
        run: |
          set -eu
          mvn -B -ntp -f m3/guava-package-first/pom.xml \
            -DskipTests test-compile dependency:build-classpath \
            -Dmdep.outputFile="$RUNNER_TEMP/m3-guava-cp.txt"
          CP="m3/guava-package-first/target/classes:m3/guava-package-first/target/test-classes:$(cat "$RUNNER_TEMP/m3-guava-cp.txt")"
          java -ea -cp "$CP" com.m3.collections.guava.collect.M3GuavaEvictingRelocationProof
