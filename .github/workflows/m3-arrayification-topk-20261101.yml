# SPDX-License-Identifier: Apache-2.0
name: M3 Guava JRE Android top-k differential
on:
  pull_request:
    paths:
      - 'guava/src/com/m3/collections/guava/collect/TopKSelector.java'
      - 'android/guava/src/com/m3/collections/guava/collect/TopKSelector.java'
      - 'guava-tests/test/com/m3/collections/guava/collect/M3TopKSelectorArrayPassTest.java'
      - 'android/guava-tests/test/com/m3/collections/guava/collect/M3TopKSelectorArrayPassTest.java'
      - '.github/workflows/m3-arrayification-topk-20261101.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topk-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        flavor: [jre, android]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact canonical JRE and Android postimages
        shell: bash
        run: |
          set -euo pipefail
          printf 'e8e5c18644b9c1e6775c20f301a3d2b3dad753665cc15351929833c153684b07  %s\n' 'guava/src/com/m3/collections/guava/collect/TopKSelector.java' | sha256sum -c -
          printf '181e164af4860d83911b844745c5e8614204a83b86dea3d5bf4d8737ed98348a  %s\n' 'android/guava/src/com/m3/collections/guava/collect/TopKSelector.java' | sha256sum -c -
          printf '98ef2b92fcd088d7c0e6d4362393c4b87078c2f4950c8e3cdb4acf0e4d26f356  %s\n' 'guava-tests/test/com/m3/collections/guava/collect/M3TopKSelectorArrayPassTest.java' | sha256sum -c -
          printf '98ef2b92fcd088d7c0e6d4362393c4b87078c2f4950c8e3cdb4acf0e4d26f356  %s\n' 'android/guava-tests/test/com/m3/collections/guava/collect/M3TopKSelectorArrayPassTest.java' | sha256sum -c -
      - name: Execute actual Guava flavor test (no dependency bypass)
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          pom=pom.xml
          if [ "$FLAVOR" = android ]; then pom=android/pom.xml; fi
          mvn -B -ntp -f "$pom" -P m3-relocated-verification -pl guava-tests -am \
            -Dtest=M3TopKSelectorArrayPassTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Require actually executed JUnit
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import os
          base=Path('android/guava-tests' if os.environ['FLAVOR']=='android' else 'guava-tests')
          reports=list((base/'target/surefire-reports').glob('TEST-*M3TopKSelectorArrayPassTest*.xml'))
          assert reports,'NO_EXECUTED_GUAVA_JUNIT'
          a=[0,0,0,0]
          for f in reports:
              e=ET.parse(f).getroot()
              a=[x+int(e.attrib.get(k,'0')) for x,k in zip(a,('tests','failures','errors','skipped'))]
          assert a[0]>=1 and a[1:]==[0,0,0],a
          print('GUAVA_TOPK_CONTRACT_PASS',os.environ['FLAVOR'],a)
          PY
      - name: Upload flavor-specific proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-guava-topk-${{ matrix.flavor }}
          if-no-files-found: warn
          path: |
            guava-tests/target/surefire-reports/
            android/guava-tests/target/surefire-reports/
